# =============================================================================
# Quorus Controller Configuration
# =============================================================================
# All settings can be overridden by environment variables using uppercase
# with dots replaced by underscores (e.g., quorus.http.port -> QUORUS_HTTP_PORT)
# =============================================================================

# -----------------------------------------------------------------------------
# Application Info
# -----------------------------------------------------------------------------
quorus.version=2.0-ext

# -----------------------------------------------------------------------------
# Node Identity
# -----------------------------------------------------------------------------
# Unique node identifier for Raft cluster. If empty, derives from hostname.
# MUST be unique per node in a cluster.
quorus.node.id=

# -----------------------------------------------------------------------------
# HTTP Server Configuration
# -----------------------------------------------------------------------------
quorus.http.port=8080
# Phase 0 is intentionally local-only until authenticated transport trust is
# delivered. Container deployments explicitly override this inside their network.
quorus.http.host=127.0.0.1

# Maximum accepted request body. Protects the controller event loop from
# unbounded payloads; larger workflow/artifact uploads use dedicated channels.
quorus.http.max-body-bytes=1048576

# -----------------------------------------------------------------------------
# Enterprise Security (Phase 1)
# -----------------------------------------------------------------------------
# Production is fail-closed: the controller will not start until all HTTP and
# Raft trust material and at least one identity source are configured.
quorus.security.profile=production
quorus.security.enabled=true
quorus.security.allow-insecure=false

# HTTPS mutual TLS for API clients, gateways and agents.
quorus.security.http.tls.enabled=true
quorus.security.http.tls.certificate=
quorus.security.http.tls.private-key=
quorus.security.http.tls.trust-bundle=
quorus.security.http.tls.crl=

# Exact RFC 2253 certificate subjects for gateways allowed to provide the
# X-Quorus-* identity assertion headers. Separate multiple subjects with ';'.
quorus.security.trusted-gateway-subjects=

# Direct identities use:
# subject=>principal|type|tenant|environment|roles|scopes
# Separate bindings with ';' and roles/scopes with '+'.
quorus.security.mtls-identities=
quorus.security.revoked-certificate-serials=
quorus.security.trust-bundle.version=configuration
quorus.security.certificate.expiry-warning-days=30
quorus.security.audit.path=./data/audit/security-audit.jsonl
quorus.security.audit.evidence-path=./data/audit/security-audit-evidence.jsonl

# -----------------------------------------------------------------------------
# Raft Cluster Configuration
# -----------------------------------------------------------------------------
# Port for inter-node Raft gRPC communication
quorus.raft.port=9080

# Controller-to-controller mutual TLS. A peer must chain to the configured
# controller trust bundle and pass hostname verification.
quorus.security.raft.tls.enabled=true
quorus.security.raft.tls.certificate=
quorus.security.raft.tls.private-key=
quorus.security.raft.tls.trust-bundle=

# Base leader election timeout and leader heartbeat interval
quorus.raft.election-timeout-ms=5000
quorus.raft.heartbeat-interval-ms=1000

# Cluster nodes in format: nodeId=host:port,nodeId2=host2:port2
# Leave empty for single-node mode (will auto-configure)
quorus.cluster.nodes=

# -----------------------------------------------------------------------------
# Raft Storage Configuration
# -----------------------------------------------------------------------------
# Storage backend type: "raftlog" only
# - raftlog: WAL from the raftlog-core library
quorus.raft.storage.type=raftlog

# Path for Raft persistent storage (WAL and metadata)
# Default: ./data/raft/{nodeId}
# Containers set this to /app/data/raft, which is the mounted durable volume.
# Production recommendation: /var/lib/quorus/data/{nodeId}
quorus.raft.storage.path=

# Enable fsync after each WAL write for durability (default: true)
# Set to false only for testing or if using battery-backed RAID controllers
quorus.raft.storage.fsync=true

# -----------------------------------------------------------------------------
# Raft Log Capacity Configuration
# -----------------------------------------------------------------------------
# Maximum entries in the in-memory Raft log before rejecting commands (default: 100000)
# This prevents OOM when commands arrive faster than snapshots can compact.
# Commands rejected with "Raft log at capacity" error; clients should retry.
quorus.raft.log.hard-limit=100000

# -----------------------------------------------------------------------------
# Telemetry Configuration
# -----------------------------------------------------------------------------
# OpenTelemetry OTLP exporter endpoint (gRPC)
quorus.telemetry.otlp.endpoint=http://localhost:4317

# Prometheus metrics HTTP server port
quorus.telemetry.prometheus.port=9464

# Enable/disable telemetry
quorus.telemetry.enabled=true

# Service name for tracing
quorus.telemetry.service.name=quorus-controller

# Operator progress is stale after this interval without increasing transferred bytes.
quorus.telemetry.transfer.fresh-window-ms=60000

# An in-progress transfer is stalled after this interval without increasing transferred bytes.
quorus.telemetry.transfer.stall-window-ms=120000

# -----------------------------------------------------------------------------
# Job Assignment Service Configuration
# -----------------------------------------------------------------------------
# Initial delay before starting assignment processor (ms)
quorus.jobs.assignment.initial-delay-ms=5000

# Interval between assignment processing runs (ms)
quorus.jobs.assignment.interval-ms=10000

# Initial delay before starting timeout monitor (ms)
quorus.jobs.timeout.initial-delay-ms=30000

# Interval between timeout checks (ms)
quorus.jobs.timeout.interval-ms=30000

# Lease duration for an assigned transfer attempt before it is eligible for recovery (ms)
quorus.jobs.attempt.lease-duration-ms=300000

# -----------------------------------------------------------------------------
# Thread Pool Configuration
# -----------------------------------------------------------------------------
# Max threads for Raft gRPC I/O operations (default: 10)
# Replaces unbounded CachedThreadPool for resource control
quorus.raft.io.pool-size=10


