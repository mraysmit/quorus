openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Quorus Controller REST API
  version: 1.3.0-alpha
  summary: Phase 2 authenticated controller API contract with fenced agent reports
  description: >-
    Machine-readable contract for every HTTP route registered by the current Quorus
    controller. Production access uses mutual TLS. Human and integration identities
    are asserted by an explicitly trusted gateway over that authenticated hop; agent
    identities are bound directly to their client certificates. Tenant and environment
    are derived from the verified identity, never established by request content.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: https://127.0.0.1:8080
    description: Mutually authenticated controller endpoint
security:
  - mutualTls: []
tags:
  - name: Operations
  - name: Cluster
  - name: Agents
  - name: Transfers
  - name: Assignments
  - name: Routes
  - name: Security
x-assignment-mutation-responses: &AssignmentMutationResponses
  '200':
    description: Assignment state changed
    content:
      application/json:
        schema: {$ref: '#/components/schemas/AssignmentMutation'}
  '400': {$ref: '#/components/responses/Problem'}
  '404': {$ref: '#/components/responses/Problem'}
  '409': {$ref: '#/components/responses/Problem'}
  '503': {$ref: '#/components/responses/Problem'}
  default: {$ref: '#/components/responses/Problem'}
x-route-mutation-responses: &RouteMutationResponses
  '200':
    description: Route mutation accepted
    content:
      application/json:
        schema: {$ref: '#/components/schemas/RouteMutation'}
  '400': {$ref: '#/components/responses/Problem'}
  '404': {$ref: '#/components/responses/Problem'}
  '409': {$ref: '#/components/responses/Problem'}
  '503': {$ref: '#/components/responses/Problem'}
  default: {$ref: '#/components/responses/Problem'}
paths:
  /metrics:
    get:
      tags: [Operations]
      operationId: getMetrics
      summary: Export controller metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /health/live:
    get:
      security: []
      tags: [Operations]
      operationId: getLiveness
      summary: Report process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Liveness'}
        default: {$ref: '#/components/responses/Problem'}
  /health/ready:
    get:
      security: []
      tags: [Operations]
      operationId: getReadiness
      summary: Report Raft and leader readiness
      responses:
        '200':
          description: Readiness state; status may be UP or DOWN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Report detailed controller health
      responses:
        '200':
          description: Controller health and resource checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /status:
    get:
      tags: [Operations]
      operationId: getStatus
      summary: Report basic controller status
      responses:
        '200':
          description: Basic status
          content:
            application/json:
              schema:
                type: object
                required: [status, nodeId]
                properties:
                  status: {type: string}
                  nodeId: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /raft/status:
    get:
      tags: [Cluster]
      operationId: getRaftStatus
      summary: Report local Raft state
      responses:
        '200':
          description: Local cluster state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RaftStatus'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/info:
    get:
      tags: [Operations]
      operationId: getApiInfo
      summary: Discover API capabilities and endpoint inventory
      responses:
        '200':
          description: API and controller information
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/openapi.yaml:
    get:
      security: []
      tags: [Operations]
      operationId: getOpenApiContract
      summary: Download the bundled OpenAPI 3.1 contract
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/vnd.oai.openapi;version=3.1.0:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/security/me:
    get:
      tags: [Security]
      operationId: getEffectiveSecurityIdentity
      summary: Return the verified effective identity and policy attributes
      responses:
        '200':
          description: Effective authenticated identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityIdentity'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/security/authorization/explain:
    get:
      tags: [Security]
      operationId: explainAuthorization
      summary: Explain whether the caller may perform a proposed API operation
      parameters:
        - {name: method, in: query, schema: {type: string, default: GET}}
        - {name: path, in: query, schema: {type: string, default: /api/v1/info}}
        - {name: tenantId, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: classification, in: query, schema: {type: string}}
      responses:
        '200':
          description: Stable policy decision and its effective inputs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationExplanation'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/security/authorization/check:
    post:
      tags: [Security]
      operationId: checkAuthorization
      summary: Evaluate the effective policy without performing the proposed operation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationCheck'}
      responses:
        '200':
          description: Stable policy decision and its effective inputs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationExplanation'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/security/trust:
    get:
      tags: [Security]
      operationId: getSecurityTrustStatus
      summary: Observe the active trust-bundle version and caller certificate expiry posture
      responses:
        '200':
          description: Active trust and certificate-lifecycle observation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityTrustStatus'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/security/trust/revocations:
    put:
      tags: [Security]
      operationId: replaceCertificateRevocations
      summary: Atomically replace runtime certificate revocations and advance the trust version
      description: Requires an actively elevated security identity. The update applies to subsequent HTTP requests and Raft RPCs, including established TLS connections.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificateRevocationUpdate'}
      responses:
        '200':
          description: Runtime revocation state replaced and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateRevocationUpdateResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agents/register:
    post:
      tags: [Agents]
      operationId: registerAgent
      summary: Register an agent in authoritative state
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentRegistration'}
      responses:
        '201':
          description: Agent registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedAgent'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agents/heartbeat:
    post:
      tags: [Agents]
      operationId: recordAgentHeartbeat
      summary: Record agent health and optional sequence acknowledgement
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentHeartbeat'}
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeartbeatAcknowledgement'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List registered agents
      responses:
        '200':
          description: Registered agents
          content:
            application/json:
              schema:
                type: object
                required: [agents, count]
                properties:
                  agents: {type: array, items: {$ref: '#/components/schemas/Agent'}}
                  count: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/agents/{agentId}/jobs:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
    get:
      tags: [Agents, Assignments]
      operationId: listAgentJobs
      summary: Poll assignments awaiting processing by an agent
      responses:
        '200':
          description: Pending assignments
          content:
            application/json:
              schema:
                type: object
                required: [pendingJobs, total]
                properties:
                  pendingJobs: {type: array, items: {$ref: '#/components/schemas/AgentJob'}}
                  total: {type: integer, minimum: 0}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Submit a tenant-scoped transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTransfer'}
      responses:
        '201':
          description: Transfer created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedTransfer'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/transfers/{jobId}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Query transfer lifecycle and progress
      responses:
        '200':
          description: Transfer status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transfer'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Transfers]
      operationId: deleteTransfer
      summary: Delete a transfer without dependent assignments
      responses:
        '200':
          description: Transfer deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deletion'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/transfers/{jobId}/progress:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [Transfers, Operations]
      operationId: getTransferProgress
      summary: Query operational progress, telemetry freshness, and deadline condition
      description: >-
        Returns tenant-checked transfer progress with ownership, attempt, telemetry freshness,
        source-size semantics, and deadline condition. Missing telemetry is never represented
        as zero progress.
      responses:
        '200':
          description: Current operational progress view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferProgress'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/transfers/{jobId}/events:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [Transfers, Operations]
      operationId: listTransferEvents
      summary: List durable ordered transfer events
      responses:
        '200':
          description: Ordered transfer event history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferEventList'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/status:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    post:
      tags: [Transfers, Assignments]
      operationId: updateJobStatus
      summary: Record agent assignment state and transfer progress
      description: >-
        Enforces assignment lifecycle, tenant ownership, active attempt identity,
        expected state, lease, fencing generation, ordered reports, monotonic byte
        progress, and mirrors IN_PROGRESS/COMPLETED/FAILED/CANCELLED into transfer state.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobStatusUpdate'}
      responses:
        '200':
          description: Status accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Success'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/transfers/{jobId}/attempts:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [Transfers]
      operationId: listTransferAttempts
      summary: List immutable execution attempts and identify the active fencing generation
      responses:
        '200':
          description: Ordered attempt history and current active attempt, when present
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferAttemptList'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/transfers/{jobId}/attempts/{attemptId}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - name: attemptId
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      tags: [Transfers]
      operationId: getTransferAttempt
      summary: Get immutable execution-attempt, lease, ordering, and fencing evidence
      responses:
        '200':
          description: Transfer attempt evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferAttempt'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/assignments:
    get:
      tags: [Assignments]
      operationId: listAssignments
      summary: List assignments
      responses:
        '200':
          description: Assignment collection
          content:
            application/json:
              schema:
                type: object
                required: [assignments, total]
                properties:
                  assignments: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
                  total: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Assignments]
      operationId: createAssignment
      summary: Assign an existing transfer to an existing same-tenant agent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAssignment'}
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedAssignment'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/assignments/{assignmentId}:
    parameters:
      - {$ref: '#/components/parameters/AssignmentId'}
    get:
      tags: [Assignments]
      operationId: getAssignment
      summary: Query one assignment
      responses:
        '200':
          description: Assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assignment'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Assignments]
      operationId: deleteAssignment
      summary: Remove a terminal assignment
      responses:
        '200':
          description: Assignment removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deletion'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/assignments/{assignmentId}/accept:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    put:
      tags: [Assignments]
      operationId: acceptAssignment
      summary: Move ASSIGNED to ACCEPTED
      responses: *AssignmentMutationResponses
  /api/v1/assignments/{assignmentId}/reject:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    put:
      tags: [Assignments]
      operationId: rejectAssignment
      summary: Move ASSIGNED to REJECTED
      responses: *AssignmentMutationResponses
  /api/v1/assignments/{assignmentId}/status:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    put:
      tags: [Assignments]
      operationId: updateAssignmentStatus
      summary: Apply a legal assignment transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/AssignmentStatus'}
      responses: *AssignmentMutationResponses
  /api/v1/assignments/{assignmentId}/cancel:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    put:
      tags: [Assignments]
      operationId: cancelAssignment
      summary: Cancel a non-terminal assignment
      responses: *AssignmentMutationResponses
  /api/v1/routes:
    get:
      tags: [Routes]
      operationId: listRoutes
      summary: List routes
      responses:
        '200':
          description: Route collection
          content:
            application/json:
              schema:
                type: object
                required: [routes, total]
                properties:
                  routes: {type: array, items: {$ref: '#/components/schemas/Route'}}
                  total: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Routes]
      operationId: createRoute
      summary: Create a route in CONFIGURED state
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Route'}
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteMutation'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/routes/{routeId}:
    parameters: [{$ref: '#/components/parameters/RouteId'}]
    get:
      tags: [Routes]
      operationId: getRoute
      summary: Query one route
      responses:
        '200':
          description: Route
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Route'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Routes]
      operationId: updateRoute
      summary: Update route fields while preserving identifier and state
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Route'}
      responses: *RouteMutationResponses
    delete:
      tags: [Routes]
      operationId: deleteRoute
      summary: Delete a route
      responses: *RouteMutationResponses
  /api/v1/routes/{routeId}/suspend:
    parameters: [{$ref: '#/components/parameters/RouteId'}]
    put:
      tags: [Routes]
      operationId: suspendRoute
      summary: Suspend a configured or active route
      responses: *RouteMutationResponses
  /api/v1/routes/{routeId}/resume:
    parameters: [{$ref: '#/components/parameters/RouteId'}]
    put:
      tags: [Routes]
      operationId: resumeRoute
      summary: Resume a suspended route
      responses: *RouteMutationResponses
  /api/v1/service-connections:
    get:
      tags: [Service Connections]
      operationId: listServiceConnections
      summary: List tenant-scoped governed service connections
      parameters: [{$ref: '#/components/parameters/TenantIdQuery'}]
      responses:
        '200': {description: Service connections, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceConnectionList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Service Connections]
      operationId: createServiceConnection
      summary: Create a governed service connection
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceConnectionWrite'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceConnection'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/service-connections/{serviceConnectionId}:
    parameters: [{$ref: '#/components/parameters/ServiceConnectionId'}]
    get:
      tags: [Service Connections]
      operationId: getServiceConnection
      parameters: [{$ref: '#/components/parameters/TenantIdQuery'}]
      responses:
        '200': {description: Service connection, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceConnection'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Service Connections]
      operationId: updateServiceConnection
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceConnectionWrite'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceConnection'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Service Connections]
      operationId: deleteServiceConnection
      parameters: [{$ref: '#/components/parameters/TenantIdQuery'}]
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Deletion'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/service-connections/{serviceConnectionId}/validate:
    parameters: [{$ref: '#/components/parameters/ServiceConnectionId'}]
    post:
      tags: [Service Connections]
      operationId: validateServiceConnection
      summary: Perform a redacted staged policy validation
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionValidationRequest'}}}}
      responses:
        '200': {description: Validation result, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionValidation'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/secret-references:
    get:
      tags: [Secret References]
      operationId: listSecretReferences
      parameters: [{$ref: '#/components/parameters/TenantIdQuery'}]
      responses:
        '200': {description: Opaque references, content: {application/json: {schema: {$ref: '#/components/schemas/SecretReferenceList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Secret References]
      operationId: createSecretReference
      summary: Register an opaque reference; secret values are forbidden
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SecretReferenceWrite'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/SecretReference'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/secret-references/{secretReferenceId}:
    parameters: [{$ref: '#/components/parameters/SecretReferenceId'}]
    get:
      tags: [Secret References]
      operationId: getSecretReference
      parameters: [{$ref: '#/components/parameters/TenantIdQuery'}]
      responses:
        '200': {description: Opaque reference, content: {application/json: {schema: {$ref: '#/components/schemas/SecretReference'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Secret References]
      operationId: updateSecretReference
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SecretReferenceWrite'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/SecretReference'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Secret References]
      operationId: deleteSecretReference
      parameters: [{$ref: '#/components/parameters/TenantIdQuery'}]
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Deletion'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/security-events:
    get:
      tags: [Security Events]
      operationId: listSecurityEvents
      parameters: [{$ref: '#/components/parameters/TenantIdQuery'}]
      responses:
        '200': {description: Redacted security events, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityEventList'}}}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    mutualTls:
      type: mutualTLS
      description: >-
        Client certificate authentication. Trusted gateway certificates may carry
        protected X-Quorus-* identity assertions; direct agent certificates are
        resolved through configured subject-to-identity bindings.
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Canonical jobId:agentId identifier
      schema: {type: string, minLength: 3}
    RouteId:
      name: routeId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ServiceConnectionId:
      name: serviceConnectionId
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
    SecretReferenceId:
      name: secretReferenceId
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
    TenantIdQuery:
      name: tenantId
      in: query
      required: false
      description: Optional narrowing value; authenticated tenant remains authoritative.
      schema: {type: string, minLength: 1}
  responses:
    Problem:
      description: RFC 9457 problem details with Quorus extensions
      headers:
        X-Request-ID:
          schema: {type: string, maxLength: 128}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    SecurityIdentity:
      type: object
      required: [principalId, identityType, tenantId, environment, roles, scopes, authenticatedAt]
      properties:
        principalId: {type: string}
        identityType: {type: string, enum: [HUMAN, SERVICE_INTEGRATION, CONTROLLER, AGENT, DEPLOYMENT]}
        tenantId: {type: string}
        environment: {type: string}
        roles: {type: array, items: {type: string}}
        scopes: {type: array, items: {type: string}}
        authenticatedAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        elevationExpiresAt: {type: [string, 'null'], format: date-time}
    AuthorizationExplanation:
      type: object
      required: [allowed, decisionCode, reason, requiredScope, effectiveIdentity]
      properties:
        allowed: {type: boolean}
        decisionCode: {type: string}
        reason: {type: string}
        requiredScope: {type: string}
        effectiveIdentity: {$ref: '#/components/schemas/SecurityIdentity'}
    AuthorizationCheck:
      type: object
      required: [method, path]
      properties:
        method: {type: string}
        path: {type: string}
        tenantId: {type: string}
        environment: {type: string}
        classification: {type: string}
    SecurityTrustStatus:
      type: object
      required: [trustBundleVersion, trustBundleLoadedAt, revokedCertificateCount, certificateSubject,
        certificateExpiresAt, certificateSecondsRemaining, expiryWarningThresholdSeconds, expiryAlertState]
      properties:
        trustBundleVersion: {type: string, minLength: 1}
        trustBundleLoadedAt: {type: string, format: date-time}
        revokedCertificateCount: {type: integer, minimum: 0}
        certificateSubject: {type: string}
        certificateExpiresAt: {type: string, format: date-time}
        certificateSecondsRemaining: {type: integer, format: int64}
        expiryWarningThresholdSeconds: {type: integer, format: int64, minimum: 1}
        expiryAlertState: {type: string, enum: [OK, WARNING, EXPIRED]}
      additionalProperties: false
    CertificateRevocationUpdate:
      type: object
      required: [trustBundleVersion, revokedCertificateSerials]
      properties:
        trustBundleVersion: {type: string, minLength: 1}
        revokedCertificateSerials:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
      additionalProperties: false
    CertificateRevocationUpdateResult:
      type: object
      required: [trustBundleVersion, loadedAt, revokedCertificateCount]
      properties:
        trustBundleVersion: {type: string, minLength: 1}
        loadedAt: {type: string, format: date-time}
        revokedCertificateCount: {type: integer, minimum: 0}
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, detail, instance, shortCode, code, timestamp, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        shortCode: {type: string, pattern: '^Q-[0-9]{4}$'}
        code: {type: string}
        timestamp: {type: string, format: date-time}
        requestId: {type: string, maxLength: 128}
        traceId: {type: string}
      additionalProperties: false
    Success:
      type: object
      required: [success]
      properties: {success: {type: boolean, const: true}}
      additionalProperties: false
    TrustPolicy:
      type: object
      required: [tlsRequired, hostnameVerification, approvedCaIds, sshHostKeyFingerprints,
        minimumTlsVersion, tlsPeerFingerprints, transportEncryptionRequired]
      properties:
        tlsRequired: {type: boolean}
        hostnameVerification: {type: boolean}
        approvedCaIds:
          type: array
          uniqueItems: true
          description: SHA-256 fingerprints of CA certificates allowed within an otherwise valid PKIX chain.
          items: {type: string, pattern: '^SHA256:.+'}
        sshHostKeyFingerprints: {type: array, uniqueItems: true, items: {type: string, pattern: '^SHA256:.+'}}
        minimumTlsVersion: {type: string, enum: [TLSv1.2, TLSv1.3]}
        tlsPeerFingerprints: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
        transportEncryptionRequired: {type: boolean}
      additionalProperties: false
    EgressPolicy:
      type: object
      required: [allowedHostnames, allowedCidrs, allowedPorts, allowRedirects, pinResolvedAddresses]
      properties:
        allowedHostnames: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        allowedCidrs: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        allowedPorts: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
        allowRedirects: {type: boolean, const: false}
        pinResolvedAddresses: {type: boolean, const: true}
      additionalProperties: false
    ServiceConnectionWrite:
      type: object
      required: [tenantId, protocol, endpoint, networkZone, allowedPaths, allowedDirections,
        allowedAgentPools, owner, environment, classification, secretReferenceId, serviceIdentity,
        authenticationType, trustPolicy, egressPolicy]
      properties:
        serviceConnectionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
        tenantId: {type: string, minLength: 1}
        protocol: {type: string, enum: [SFTP, HTTPS, FTPS, SMB, NFS]}
        endpoint: {type: string, format: uri, description: Credential-free service endpoint origin.}
        networkZone: {type: string, minLength: 1}
        allowedPaths: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: '^/'}}
        allowedDirections: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [DOWNLOAD, UPLOAD]}}
        allowedAgentPools: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        owner: {type: string, minLength: 1}
        environment: {type: string, minLength: 1}
        classification: {type: string, minLength: 1}
        secretReferenceId: {type: string, minLength: 1}
        serviceIdentity: {type: string, minLength: 1}
        authenticationType:
          type: string
          description: Protocol constrained — SFTP PASSWORD/SSH_PRIVATE_KEY, HTTPS BASIC/BEARER, FTPS PASSWORD, SMB/NFS KERBEROS.
          enum: [PASSWORD, BASIC, BEARER, SSH_PRIVATE_KEY, KERBEROS]
        trustPolicy: {$ref: '#/components/schemas/TrustPolicy'}
        egressPolicy: {$ref: '#/components/schemas/EgressPolicy'}
        status: {type: string, enum: [ACTIVE, SUSPENDED, REVOKED]}
      additionalProperties: false
    ServiceConnection:
      allOf:
        - {$ref: '#/components/schemas/ServiceConnectionWrite'}
        - type: object
          required: [serviceConnectionId, policyVersion, status, createdAt, updatedAt]
          properties:
            serviceConnectionId: {type: string}
            policyVersion: {type: integer, minimum: 1}
            status: {type: string, enum: [ACTIVE, SUSPENDED, REVOKED]}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    ServiceConnectionList:
      type: object
      required: [serviceConnections, total]
      properties:
        serviceConnections: {type: array, items: {$ref: '#/components/schemas/ServiceConnection'}}
        total: {type: integer, minimum: 0}
    SecretReferenceWrite:
      type: object
      required: [tenantId, provider, path, key, version]
      properties:
        secretReferenceId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
        tenantId: {type: string, minLength: 1}
        provider: {type: string, enum: [VAULT_KV_V2]}
        path: {type: string, minLength: 1}
        key: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        status: {type: string, enum: [ACTIVE, REVOKED, EXPIRED]}
        expiresAt: {type: [string, 'null'], format: date-time}
        lastRotatedAt: {type: [string, 'null'], format: date-time}
      additionalProperties: false
    SecretReference:
      allOf:
        - {$ref: '#/components/schemas/SecretReferenceWrite'}
        - type: object
          required: [secretReferenceId, status]
          properties:
            secretReferenceId: {type: string}
            status: {type: string, enum: [ACTIVE, REVOKED, EXPIRED]}
    SecretReferenceList:
      type: object
      required: [secretReferences, total]
      properties:
        secretReferences: {type: array, items: {$ref: '#/components/schemas/SecretReference'}}
        total: {type: integer, minimum: 0}
    ConnectionValidationRequest:
      type: object
      required: [tenantId, remotePath, direction, agentPool]
      properties:
        tenantId: {type: string, minLength: 1}
        remotePath: {type: string, pattern: '^/'}
        direction: {type: string, enum: [DOWNLOAD, UPLOAD]}
        agentPool: {type: string, minLength: 1}
        probeNetwork:
          type: boolean
          default: false
          description: When true, open a bounded TCP route probe to a controller-approved resolved address.
        probeTimeoutMillis: {type: integer, minimum: 100, maximum: 10000, default: 3000}
      additionalProperties: false
    ConnectionValidationStage:
      type: object
      required: [stage, status, detail]
      properties:
        stage: {type: string, enum: [POLICY, DNS, ROUTE, NEGOTIATION, IDENTITY, AUTHENTICATION, AUTHORIZATION]}
        status: {type: string}
        detail: {type: string}
        addressCount: {type: integer, minimum: 0}
        latencyMillis: {type: integer, format: int64, minimum: 0}
      additionalProperties: false
    ConnectionValidation:
      type: object
      required: [status, serviceConnectionId, policyVersion, policyDigest, stages]
      properties:
        status: {type: string, enum: [POLICY_APPROVED, ROUTE_VERIFIED, VALID, INVALID]}
        serviceConnectionId: {type: string}
        policyVersion: {type: integer, minimum: 1}
        policyDigest: {type: string}
        stages: {type: array, items: {$ref: '#/components/schemas/ConnectionValidationStage'}}
    SecurityEvent:
      type: object
      required: [eventId, tenantId, eventType, resourceType, resourceId, outcome, reasonCode, timestamp]
      properties:
        eventId: {type: string, format: uuid}
        tenantId: {type: string}
        eventType: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        outcome: {type: string, enum: [SUCCESS, DENIED, FAILED]}
        reasonCode: {type: string}
        policyVersion: {type: integer, minimum: 1}
        timestamp: {type: string, format: date-time}
      additionalProperties: false
    SecurityEventList:
      type: object
      required: [events, total]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/SecurityEvent'}}
        total: {type: integer, minimum: 0}
    Liveness:
      type: object
      required: [status, timestamp]
      properties:
        status: {type: string, const: UP}
        timestamp: {type: string, format: date-time}
      additionalProperties: false
    Readiness:
      type: object
      required: [status, timestamp, checks]
      properties:
        status: {type: string, enum: [UP, DOWN]}
        timestamp: {type: string, format: date-time}
        checks:
          type: object
          required: [raftRunning, clusterHasLeader]
          properties:
            raftRunning: {type: string, enum: [UP, DOWN]}
            clusterHasLeader: {type: string, enum: [UP, DOWN]}
    Health:
      type: object
      required: [status, version, timestamp, nodeId, raft, checks]
      properties:
        status: {type: string, enum: [UP, DEGRADED]}
        version: {type: string}
        timestamp: {type: string, format: date-time}
        nodeId: {type: string}
        raft: {$ref: '#/components/schemas/RaftStatus'}
        checks: {type: object, additionalProperties: {type: string}}
    RaftStatus:
      type: object
      required: [nodeId, state, currentTerm, isLeader]
      properties:
        nodeId: {type: string}
        state: {type: string, enum: [FOLLOWER, CANDIDATE, LEADER]}
        currentTerm: {type: integer, format: int64, minimum: 0}
        isLeader: {type: boolean}
        isRunning: {type: boolean}
        leaderId: {type: [string, 'null']}
        term: {type: integer, format: int64}
        commitIndex: {type: integer, format: int64}
    AgentRegistration:
      type: object
      required: [agentId, hostname, address]
      properties:
        agentId: {type: string, minLength: 1}
        hostname: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        port: {type: integer, minimum: 1, maximum: 65535}
        tenantId:
          type: string
          minLength: 1
          description: Optional narrowing value; it must match the authenticated tenant.
        status: {$ref: '#/components/schemas/AgentStatus'}
        version: {type: string}
        region: {type: string}
        datacenter: {type: string}
        agentPool:
          type: string
          description: Deployment-bound pool used for governed scheduling and agent-side re-authorization.
        networkZone:
          type: string
          description: Deployment-bound network zone used for governed scheduling and agent-side re-authorization.
        capabilities: {type: object, additionalProperties: true}
    Agent:
      allOf:
        - {$ref: '#/components/schemas/AgentRegistration'}
        - type: object
          properties:
            registrationTime: {type: string, format: date-time}
            lastHeartbeat: {type: string, format: date-time}
            healthy: {type: boolean}
            available: {type: boolean}
    AgentStatus:
      type: string
      enum: [REGISTERED, ONLINE, BUSY, OFFLINE, UNHEALTHY, DRAINING, DEREGISTERED]
    AgentHeartbeat:
      type: object
      required: [agentId]
      properties:
        agentId: {type: string, minLength: 1}
        tenantId: {type: string}
        status: {$ref: '#/components/schemas/AgentStatus'}
        sequenceNumber: {type: integer, minimum: 0}
    CreatedAgent:
      type: object
      required: [success, agentId]
      properties:
        success: {type: boolean, const: true}
        agentId: {type: string}
    HeartbeatAcknowledgement:
      type: object
      required: [success, agentId, message]
      properties:
        success: {type: boolean, const: true}
        agentId: {type: string}
        message: {type: string}
        status: {type: string}
        lastHeartbeat: {type: string, format: date-time}
        acknowledgedSequenceNumber: {type: integer}
    CreateTransfer:
      type: object
      required: [jobId]
      oneOf:
        - required: [sourceUri, destinationPath]
        - required: [serviceConnectionId, remotePath, agentPool, destinationPath]
        - required: [serviceConnectionId, remotePath, agentPool, direction, sourceUri]
          properties:
            direction: {const: UPLOAD}
      properties:
        jobId: {type: string, minLength: 1}
        tenantId:
          type: string
          minLength: 1
          description: Optional narrowing value; it must match the authenticated tenant.
        sourceUri:
          type: string
          format: uri
          description: Local file URI for a governed upload, or a credential-free development-only direct source.
        serviceConnectionId: {type: string, minLength: 1}
        remotePath: {type: string, pattern: '^/'}
        agentPool: {type: string, minLength: 1}
        direction: {type: string, enum: [DOWNLOAD, UPLOAD], default: DOWNLOAD}
        destinationPath: {type: string, minLength: 1}
        totalBytes: {type: integer, format: int64, minimum: 0}
        description: {type: string}
        metadata:
          type: object
          additionalProperties: {type: string}
        businessService: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        criticality: {type: string, enum: [LOW, STANDARD, HIGH, CRITICAL]}
        environment: {type: string, minLength: 1}
        processingDate: {type: string, format: date}
        expectedStartAt: {type: string, format: date-time}
        requiredCompletionAt: {type: string, format: date-time}
        runbookUrl: {type: string, format: uri}
        runbook:
          type: object
          properties:
            url: {type: string, format: uri}
          additionalProperties: false
        labels:
          type: object
          additionalProperties: {type: string}
      additionalProperties: false
    CreatedTransfer:
      type: object
      required: [success, jobId]
      properties:
        success: {type: boolean, const: true}
        jobId: {type: string}
    Transfer:
      type: object
      required: [jobId, sourceUri, destinationPath, status, totalBytes, bytesTransferred]
      properties:
        jobId: {type: string}
        sourceUri: {type: string, format: uri}
        destinationUri: {type: string, format: uri}
        destinationPath: {type: string}
        status: {$ref: '#/components/schemas/TransferStatus'}
        totalBytes: {type: integer, format: int64, minimum: 0}
        bytesTransferred: {type: integer, format: int64, minimum: 0}
        progressPercentage: {type: number, minimum: 0, maximum: 100}
        startTime: {type: string, format: date-time}
        lastUpdateTime: {type: string, format: date-time}
        errorMessage: {type: string}
        description: {type: string}
    TransferStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED, CANCELLED, PAUSED]
    TransferProgress:
      type: object
      required: [jobId, observedAt, bytesTransferred, totalBytes, sourceSizeState, telemetryState, freshnessWindowSeconds, stallWindowSeconds, telemetryPolicySource, condition, conditionReason, confidence, retryCount]
      properties:
        jobId: {type: string}
        observedAt: {type: string, format: date-time}
        lastProgressAt: {type: string, format: date-time}
        bytesTransferred: {type: integer, format: int64, minimum: 0}
        totalBytes: {type: integer, format: int64}
        percentComplete: {type: number, minimum: 0, maximum: 100}
        sourceSizeState: {type: string, enum: [KNOWN, UNKNOWN]}
        telemetryState: {type: string, enum: [FRESH, STALE, UNKNOWN]}
        telemetryAgeSeconds: {type: integer, format: int64, minimum: 0}
        freshnessWindowSeconds: {type: integer, format: int64, minimum: 0}
        stallWindowSeconds: {type: integer, format: int64, minimum: 0}
        telemetryPolicySource: {type: string, enum: [CONTROLLER_CONFIGURATION]}
        condition: {type: string, enum: [ON_TRACK, AT_RISK, LATE, STALLED, DEGRADED, UNKNOWN]}
        conditionReason: {type: string}
        conditionSince: {type: string, format: date-time}
        stallDurationSeconds: {type: integer, format: int64, minimum: 0}
        confidence: {type: string, enum: [INSUFFICIENT_DATA, LOW, MEDIUM, HIGH]}
        businessService: {type: string}
        owner: {type: string}
        criticality: {type: string}
        environment: {type: string}
        processingDate: {type: string, format: date}
        expectedStartAt: {type: string, format: date-time}
        requiredCompletionAt: {type: string, format: date-time}
        timeRemainingSeconds: {type: integer, format: int64}
        runbookUrl: {type: string, format: uri}
        activeAttemptId: {type: string}
        agentId: {type: string}
        attemptNumber: {type: integer, minimum: 1}
    TransferEventList:
      type: object
      required: [jobId, events]
      properties:
        jobId: {type: string}
        events:
          type: array
          items: {$ref: '#/components/schemas/TransferEvent'}
    TransferEvent:
      type: object
      required: [eventId, sequence, eventType, occurredAt, recordedAt, jobId, tenantId, currentState]
      properties:
        eventId: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
        jobId: {type: string}
        tenantId: {type: string}
        businessService: {type: string}
        attemptId: {type: string}
        agentId: {type: string}
        bytesTransferred: {type: integer, format: int64, minimum: 0}
        totalBytes: {type: integer, format: int64, minimum: 0}
        reportSequence: {type: integer, format: int64, minimum: 0}
        previousState: {type: string}
        currentState: {type: string}
        retryCount: {type: integer, minimum: 0}
        averageBytesPerSecond: {type: number, minimum: 0}
        estimatedCompletionAt: {type: string, format: date-time}
        estimatedDeadlineMarginSeconds: {type: integer, format: int64}
    TransferAttemptList:
      type: object
      required: [jobId, items, count]
      properties:
        jobId: {type: string}
        activeAttemptId: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/TransferAttempt'}
        count: {type: integer, minimum: 0}
    TransferAttempt:
      type: object
      required: [attemptId, jobId, agentId, tenantId, attemptNumber, fencingGeneration, leaseExpiresAt, status, outcome, lastReportSequence, bytesTransferred, createdAt, updatedAt]
      properties:
        attemptId: {type: string}
        jobId: {type: string}
        agentId: {type: string}
        tenantId: {type: string}
        attemptNumber: {type: integer, minimum: 1}
        fencingGeneration: {type: integer, format: int64, minimum: 1}
        leaseExpiresAt: {type: string, format: date-time}
        status:
          type: string
          enum: [OFFERED, ACCEPTED, IN_PROGRESS, COMPLETED, FAILED, REJECTED, CANCELLED, EXPIRED, FENCED, RECONCILIATION_REQUIRED]
        outcome:
          type: string
          enum: [NONE, SUCCEEDED, RETRYABLE_FAILURE, TERMINAL_FAILURE, REJECTED, CANCELLED, LEASE_EXPIRED, SUPERSEDED, RECONCILIATION_REQUIRED]
        lastReportSequence: {type: integer, format: int64, minimum: 0}
        bytesTransferred: {type: integer, format: int64, minimum: 0}
        outcomeReason: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    AgentJob:
      type: object
      required: [assignmentId, jobId, agentId, status, assignedAt, attemptId, fencingGeneration, leaseExpiresAt, lastReportSequence]
      properties:
        assignmentId: {type: string}
        jobId: {type: string}
        agentId: {type: string}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        assignedAt: {type: string, format: date-time}
        attemptId: {type: string, minLength: 1}
        fencingGeneration: {type: integer, format: int64, minimum: 1}
        leaseExpiresAt: {type: string, format: date-time}
        lastReportSequence: {type: integer, format: int64, minimum: 0}
        sourceUri: {type: string, format: uri}
        destinationPath: {type: string}
        totalBytes: {type: integer, format: int64}
        description: {type: string}
        tenantId: {type: string}
        remotePath: {type: string}
        agentPool: {type: string}
        connectionPolicyVersion: {type: integer, minimum: 1}
        connectionPolicyDigest: {type: string}
        controllerResolvedAddresses: {type: array, items: {type: string}}
        serviceConnection: {$ref: '#/components/schemas/ServiceConnection'}
        secretReference: {$ref: '#/components/schemas/SecretReference'}
    CreateAssignment:
      type: object
      required: [jobId, agentId]
      properties:
        jobId: {type: string, minLength: 1}
        agentId: {type: string, minLength: 1}
        assignedAt: {type: string, format: date-time}
        status: {type: string, const: ASSIGNED}
        tenantId: {type: string, minLength: 1}
        retryCount: {type: integer, minimum: 0}
        estimatedDurationMs: {type: integer, format: int64, minimum: 0}
        assignmentStrategy: {type: string}
    Assignment:
      allOf:
        - {$ref: '#/components/schemas/CreateAssignment'}
        - type: object
          required: [assignmentId]
          properties:
            assignmentId: {type: string}
            status: {$ref: '#/components/schemas/AssignmentStatus'}
            acceptedAt: {type: string, format: date-time}
            startedAt: {type: string, format: date-time}
            completedAt: {type: string, format: date-time}
            failureReason: {type: string}
            active: {type: boolean}
            terminal: {type: boolean}
    AssignmentStatus:
      type: string
      enum: [ASSIGNED, ACCEPTED, IN_PROGRESS, COMPLETED, FAILED, REJECTED, TIMEOUT, CANCELLED]
    CreatedAssignment:
      type: object
      required: [success, assignmentId, attemptId]
      properties:
        success: {type: boolean, const: true}
        assignmentId: {type: string}
        attemptId: {type: string, minLength: 1}
    AssignmentMutation:
      type: object
      required: [assignmentId, message]
      properties:
        assignmentId: {type: string}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        message: {type: string}
    JobStatusUpdate:
      type: object
      required: [agentId, status, attemptId, expectedState, fencingGeneration, reportSequence]
      properties:
        agentId: {type: string, minLength: 1}
        status:
          type: string
          enum: [ACCEPTED, IN_PROGRESS, COMPLETED, FAILED, CANCELLED]
        attemptId: {type: string, minLength: 1}
        expectedState: {$ref: '#/components/schemas/TransferAttemptStatus'}
        fencingGeneration: {type: integer, format: int64, minimum: 1}
        reportSequence: {type: integer, format: int64, minimum: 1}
        bytesTransferred: {type: integer, format: int64, minimum: 0}
        errorMessage: {type: string}
    Route:
      type: object
      required: [routeId, name, sourceAgentId, sourceLocation, destinationAgentId, destinationLocation, trigger]
      properties:
        routeId: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        description: {type: string}
        sourceAgentId: {type: string, minLength: 1}
        sourceLocation: {type: string, minLength: 1}
        destinationAgentId: {type: string, minLength: 1}
        destinationLocation: {type: string, minLength: 1}
        trigger: {$ref: '#/components/schemas/Trigger'}
        status: {type: string, enum: [CONFIGURED, ACTIVE, SUSPENDED, DEGRADED, ERROR]}
        options: {type: object, additionalProperties: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Trigger:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [EVENT, TIME, INTERVAL, BATCH, SIZE, COMPOSITE]}
        eventPatterns: {type: array, items: {type: string}}
        excludePatterns: {type: array, items: {type: string}}
        debounceMs: {type: integer, format: int64, minimum: 0}
        cronExpression: {type: string}
        timezone: {type: string}
        intervalMinutes: {type: integer, minimum: 0}
        fileCountThreshold: {type: integer, minimum: 0}
        sizeThresholdMb: {type: integer, format: int64, minimum: 0}
        maxWaitMinutes: {type: integer, minimum: 0}
        compositeOperator: {type: string, enum: [AND, OR]}
        childTriggers: {type: array, items: {$ref: '#/components/schemas/Trigger'}}
    RouteMutation:
      type: object
      required: [routeId]
      properties:
        success: {type: boolean}
        routeId: {type: string}
        status: {type: string}
        message: {type: string}
    Deletion:
      type: object
      required: [message]
      properties:
        jobId: {type: string}
        assignmentId: {type: string}
        routeId: {type: string}
        message: {type: string}
