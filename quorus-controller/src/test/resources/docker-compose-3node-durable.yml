# 3-node Raft cluster with persistent named volumes.
#
# R1-1 container-recreation acceptance fixture. Unlike docker-compose-3node-prebuilt.yml,
# every controller writes its WAL, metadata and snapshots to a named volume mounted at
# /app/data, and QUORUS_RAFT_STORAGE_PATH points into that volume. Destroying the
# containers with `docker compose down` (without -v) therefore preserves authoritative
# state, which is exactly the deployment shape this acceptance gate exercises.
#
# The snapshot threshold and check interval are deliberately small so that a handful of
# submitted transfers produce a real snapshot and a real WAL prefix compaction within the
# test's runtime. That is the condition R1 cares about: recovery from a durable snapshot
# plus a compacted log, not recovery by replaying a full WAL.
#
# Requires the quorus-controller:test image built by SharedDockerCluster.

services:
  controller1:
    image: quorus-controller:test
    hostname: controller1
    # Plaintext fixture only; production defaults remain fail-closed.
    environment:
      - QUORUS_SECURITY_PROFILE=development
      - QUORUS_SECURITY_ENABLED=false
      - QUORUS_SECURITY_ALLOW_INSECURE=true
      - QUORUS_SECURITY_HTTP_TLS_ENABLED=false
      - QUORUS_SECURITY_RAFT_TLS_ENABLED=false
      - QUORUS_NODE_ID=controller1
      - QUORUS_RAFT_HOST=0.0.0.0
      - QUORUS_RAFT_PORT=9080
      - QUORUS_HTTP_PORT=8080
      - QUORUS_CLUSTER_NODES=controller1=controller1:9080,controller2=controller2:9080,controller3=controller3:9080
      - QUORUS_RAFT_ELECTION_TIMEOUT_MS=1500
      - QUORUS_RAFT_HEARTBEAT_INTERVAL_MS=300
      - QUORUS_RAFT_STORAGE_PATH=/app/data/raft
      - QUORUS_RAFT_STORAGE_FSYNC=true
      - QUORUS_RAFT_SNAPSHOT_ENABLED=true
      - QUORUS_RAFT_SNAPSHOT_THRESHOLD=3
      - QUORUS_RAFT_SNAPSHOT_CHECK_INTERVAL_MS=2000
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080"
    volumes:
      - controller1-data:/app/data
    networks:
      - raft-durable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  controller2:
    image: quorus-controller:test
    hostname: controller2
    # Plaintext fixture only; production defaults remain fail-closed.
    environment:
      - QUORUS_SECURITY_PROFILE=development
      - QUORUS_SECURITY_ENABLED=false
      - QUORUS_SECURITY_ALLOW_INSECURE=true
      - QUORUS_SECURITY_HTTP_TLS_ENABLED=false
      - QUORUS_SECURITY_RAFT_TLS_ENABLED=false
      - QUORUS_NODE_ID=controller2
      - QUORUS_RAFT_HOST=0.0.0.0
      - QUORUS_RAFT_PORT=9080
      - QUORUS_HTTP_PORT=8080
      - QUORUS_CLUSTER_NODES=controller1=controller1:9080,controller2=controller2:9080,controller3=controller3:9080
      - QUORUS_RAFT_ELECTION_TIMEOUT_MS=1500
      - QUORUS_RAFT_HEARTBEAT_INTERVAL_MS=300
      - QUORUS_RAFT_STORAGE_PATH=/app/data/raft
      - QUORUS_RAFT_STORAGE_FSYNC=true
      - QUORUS_RAFT_SNAPSHOT_ENABLED=true
      - QUORUS_RAFT_SNAPSHOT_THRESHOLD=3
      - QUORUS_RAFT_SNAPSHOT_CHECK_INTERVAL_MS=2000
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080"
    volumes:
      - controller2-data:/app/data
    networks:
      - raft-durable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  controller3:
    image: quorus-controller:test
    hostname: controller3
    # Plaintext fixture only; production defaults remain fail-closed.
    environment:
      - QUORUS_SECURITY_PROFILE=development
      - QUORUS_SECURITY_ENABLED=false
      - QUORUS_SECURITY_ALLOW_INSECURE=true
      - QUORUS_SECURITY_HTTP_TLS_ENABLED=false
      - QUORUS_SECURITY_RAFT_TLS_ENABLED=false
      - QUORUS_NODE_ID=controller3
      - QUORUS_RAFT_HOST=0.0.0.0
      - QUORUS_RAFT_PORT=9080
      - QUORUS_HTTP_PORT=8080
      - QUORUS_CLUSTER_NODES=controller1=controller1:9080,controller2=controller2:9080,controller3=controller3:9080
      - QUORUS_RAFT_ELECTION_TIMEOUT_MS=1500
      - QUORUS_RAFT_HEARTBEAT_INTERVAL_MS=300
      - QUORUS_RAFT_STORAGE_PATH=/app/data/raft
      - QUORUS_RAFT_STORAGE_FSYNC=true
      - QUORUS_RAFT_SNAPSHOT_ENABLED=true
      - QUORUS_RAFT_SNAPSHOT_THRESHOLD=3
      - QUORUS_RAFT_SNAPSHOT_CHECK_INTERVAL_MS=2000
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080"
    volumes:
      - controller3-data:/app/data
    networks:
      - raft-durable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
