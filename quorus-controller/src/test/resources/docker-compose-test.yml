
# Quorus Controller Cluster for Testcontainers Integration Testing
# NOTE: container_name removed for Testcontainers compatibility

# Raft state is written to a named volume at the same path the deployed image uses
# (see docker/compose/docker-compose-cluster.yml). Before 2026-09-07 these fixtures declared
# no volume and no storage path, so containerised tests ran Raft state on the container's
# ephemeral layer and could not have detected a container-level durability regression.
# Testcontainers removes these volumes when it stops the cluster, so each run starts clean.

services:
  controller1:
    build:
      context: ../../../..
      dockerfile: quorus-controller/Dockerfile
    hostname: controller1
    environment:
      - QUORUS_NODE_ID=controller1
      - QUORUS_RAFT_HOST=0.0.0.0
      - QUORUS_RAFT_PORT=9080
      - QUORUS_HTTP_PORT=8080
      - QUORUS_RAFT_STORAGE_PATH=/app/data/raft
      - QUORUS_CLUSTER_NODES=controller1=controller1:9080,controller2=controller2:9080,controller3=controller3:9080
      - QUORUS_RAFT_ELECTION_TIMEOUT_MS=3000
      - QUORUS_RAFT_HEARTBEAT_INTERVAL_MS=500
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080"
    volumes:
      - controller1-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  controller2:
    build:
      context: ../../../..
      dockerfile: quorus-controller/Dockerfile
    hostname: controller2
    environment:
      - QUORUS_NODE_ID=controller2
      - QUORUS_RAFT_HOST=0.0.0.0
      - QUORUS_RAFT_PORT=9080
      - QUORUS_HTTP_PORT=8080
      - QUORUS_RAFT_STORAGE_PATH=/app/data/raft
      - QUORUS_CLUSTER_NODES=controller1=controller1:9080,controller2=controller2:9080,controller3=controller3:9080
      - QUORUS_RAFT_ELECTION_TIMEOUT_MS=3000
      - QUORUS_RAFT_HEARTBEAT_INTERVAL_MS=500
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080"
    volumes:
      - controller2-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  controller3:
    build:
      context: ../../../..
      dockerfile: quorus-controller/Dockerfile
    hostname: controller3
    environment:
      - QUORUS_NODE_ID=controller3
      - QUORUS_RAFT_HOST=0.0.0.0
      - QUORUS_RAFT_PORT=9080
      - QUORUS_HTTP_PORT=8080
      - QUORUS_RAFT_STORAGE_PATH=/app/data/raft
      - QUORUS_CLUSTER_NODES=controller1=controller1:9080,controller2=controller2:9080,controller3=controller3:9080
      - QUORUS_RAFT_ELECTION_TIMEOUT_MS=3000
      - QUORUS_RAFT_HEARTBEAT_INTERVAL_MS=500
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080"
    volumes:
      - controller3-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  raft-cluster:
    driver: bridge

volumes:
  controller1-data:
  controller2-data:
  controller3-data:
