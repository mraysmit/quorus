# Test configuration for quorus-controller

# Default test node ID (can be overridden in individual tests)
quorus.node.id=test-node

# Use memory storage for tests
quorus.raft.storage.type=memory

# Blank values must fall back to the node-specific durable default.
quorus.raft.storage.path=

# Disable fsync for faster tests
quorus.raft.storage.fsync=false
