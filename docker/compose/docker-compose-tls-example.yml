# LOCAL TLS EXAMPLE. This topology generates short-lived demonstration certificates
# and exercises the production fail-closed HTTP and Raft mTLS configuration.
# Replace every generated key, certificate, identity and audit/storage choice before
# using Quorus outside a local workstation.

name: quorus-tls-example

services:
  certificate-generator:
    image: alpine/openssl:3.5.4
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - |
        if [ -s /certs/ca.crt ] && [ -s /certs/controller.crt ] && [ -s /certs/gateway.crt ]; then
          echo "Reusing the existing local TLS example certificates."
          exit 0
        fi
        rm -f /certs/*
        openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 30 \
          -subj '/CN=Quorus Development CA' \
          -keyout /certs/ca.key -out /certs/ca.crt
        openssl req -newkey rsa:2048 -sha256 -nodes \
          -subj '/CN=controller-tls' \
          -keyout /certs/controller.key -out /certs/controller.csr
        printf '%s\n' \
          'subjectAltName=DNS:controller-tls,DNS:localhost,IP:127.0.0.1' \
          'extendedKeyUsage=serverAuth,clientAuth' \
          'keyUsage=digitalSignature,keyEncipherment' > /certs/controller.ext
        openssl x509 -req -sha256 -days 30 \
          -in /certs/controller.csr -CA /certs/ca.crt -CAkey /certs/ca.key \
          -CAcreateserial -extfile /certs/controller.ext -out /certs/controller.crt
        openssl req -newkey rsa:2048 -sha256 -nodes \
          -subj '/CN=quorus-dev-gateway' \
          -keyout /certs/gateway.key -out /certs/gateway.csr
        printf '%s\n' \
          'extendedKeyUsage=clientAuth' \
          'keyUsage=digitalSignature,keyEncipherment' > /certs/gateway.ext
        openssl x509 -req -sha256 -days 30 \
          -in /certs/gateway.csr -CA /certs/ca.crt -CAkey /certs/ca.key \
          -CAserial /certs/ca.srl -extfile /certs/gateway.ext -out /certs/gateway.crt
        chown 1001:1001 /certs/controller.key /certs/gateway.key
        chmod 600 /certs/controller.key /certs/gateway.key
        chmod 644 /certs/*.crt
    volumes:
      - tls-material:/certs
    restart: "no"

  controller-tls:
    build:
      context: ../..
      dockerfile: quorus-controller/Dockerfile
    container_name: quorus-controller-tls-example
    hostname: controller-tls
    depends_on:
      certificate-generator:
        condition: service_completed_successfully
    environment:
      - QUORUS_NODE_ID=controller-tls
      - QUORUS_HTTP_HOST=0.0.0.0
      - QUORUS_HTTP_PORT=8080
      - QUORUS_RAFT_PORT=9080
      - QUORUS_CLUSTER_NODES=controller-tls=controller-tls:9080
      - QUORUS_RAFT_STORAGE_PATH=/app/data/raft
      - QUORUS_SECURITY_PROFILE=production
      - QUORUS_SECURITY_ENABLED=true
      - QUORUS_SECURITY_ALLOW_INSECURE=false
      - QUORUS_SECURITY_HTTP_TLS_ENABLED=true
      - QUORUS_SECURITY_HTTP_TLS_CERTIFICATE=/run/quorus-tls/controller.crt
      - QUORUS_SECURITY_HTTP_TLS_PRIVATE_KEY=/run/quorus-tls/controller.key
      - QUORUS_SECURITY_HTTP_TLS_TRUST_BUNDLE=/run/quorus-tls/ca.crt
      - QUORUS_SECURITY_RAFT_TLS_ENABLED=true
      - QUORUS_SECURITY_RAFT_TLS_CERTIFICATE=/run/quorus-tls/controller.crt
      - QUORUS_SECURITY_RAFT_TLS_PRIVATE_KEY=/run/quorus-tls/controller.key
      - QUORUS_SECURITY_RAFT_TLS_TRUST_BUNDLE=/run/quorus-tls/ca.crt
      - QUORUS_SECURITY_TRUSTED_GATEWAY_SUBJECTS=CN=quorus-dev-gateway
      - QUORUS_SECURITY_TRUST_BUNDLE_VERSION=local-example-1
      - QUORUS_SECURITY_AUDIT_PATH=/app/data/audit/security-audit.jsonl
      - QUORUS_SECURITY_AUDIT_EVIDENCE_PATH=/app/data/audit/security-audit-evidence.jsonl
      - QUORUS_TELEMETRY_ENABLED=false
      - QUORUS_HEALTHCHECK_CLIENT_CERTIFICATE=/run/quorus-tls/gateway.crt
      - QUORUS_HEALTHCHECK_CLIENT_PRIVATE_KEY=/run/quorus-tls/gateway.key
      - JAVA_OPTS=-Xmx512m -Xms256m
    ports:
      - "127.0.0.1:8443:8080"
    volumes:
      - tls-material:/run/quorus-tls:ro
      - controller-tls-data:/app/data
    networks:
      - quorus-tls
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --cacert
        - /run/quorus-tls/ca.crt
        - --cert
        - /run/quorus-tls/gateway.crt
        - --key
        - /run/quorus-tls/gateway.key
        - https://localhost:8080/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  quorus-tls:
    driver: bridge

volumes:
  tls-material:
  controller-tls-data:
