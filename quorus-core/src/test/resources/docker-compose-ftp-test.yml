# FTP server for upload/download integration testing
# Uses delfer/alpine-ftp-server - actively maintained Alpine-based vsftpd
# (same image used for FTPS tests, but without TLS configuration)
#
# IMPORTANT: Uses direct port mappings instead of Testcontainers' socat proxy.
# Tests inject available host ports for each run. This is necessary because vsftpd
# verifies that data connections come from the same IP as the control
# connection (425 Security: Bad IP connecting). The socat proxy changes
# the source IP, breaking this check.
#
# Migrated from fauria/vsftpd (unmaintained since 2023) on 2026-03-02.

services:
  # FTP Server for testing (plain FTP, no TLS)
  ftp:
    build:
      context: ./ftp-docker
      dockerfile: Dockerfile
    ports:
      - "${FTP_CONTROL_PORT:-2100}:21" # Control port (default supports manual use)
      # The host/container data port values must match the PASV response.
      - "${FTP_DATA_PORT:-21100}:${FTP_DATA_PORT:-21100}"
    environment:
      # FTP credentials (delfer format: name|password)
      USERS: "testuser|testpass"
      # Passive mode configuration
      ADDRESS: "127.0.0.1"
      MIN_PORT: "${FTP_DATA_PORT:-21100}"
      MAX_PORT: "${FTP_DATA_PORT:-21100}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
